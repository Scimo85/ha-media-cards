# Esempi di configurazione delle card (modifica plancia › aggiungi scheda › Manuale).
# Le entità media_player.* e script.* sono esempi: usate le vostre.

# Cosa si sta guardando su Jellyfin, con pausa e stop (sparisce se non c'è niente)
type: custom:jellyfin-now-card
devices:                       # opzionale: raggruppa le sessioni di un dispositivo
  - name: TV
    players: [media_player.tv_jellyfin, media_player.tv_jellyfin_2]
    power: media_player.tv     # se la TV è spenta, la sessione "appesa" non si mostra
---
# Catalogo film e serie dalla fonte multimediale Jellyfin di HA
type: custom:media-catalog-card
title: Catalogo
source: media-source://jellyfin
jellyfin_url: http://192.168.1.10:8096   # opzionale: link "Apri in Jellyfin"
refresh_minutes: 30
devices:                       # opzionale: dispositivi sempre in elenco, avviati da uno script
  - name: TV
    icon: mdi:television
    players: [media_player.tv_jellyfin]
    script: script.jellyfin_tv  # riceve media_id e media_type (vedi examples/script_tv.yaml)
---
# TV in diretta (Live TV di Jellyfin)
type: custom:livetv-card
title: TV in diretta
refresh_minutes: 5
groups:
  - name: Canali
    from: 1
    to: 9999
devices:
  - name: TV
    icon: mdi:television
    players: [media_player.tv_jellyfin]
    script: script.jellyfin_tv
---
# Radio italiane (elenco da scripts/radio_sync.py)
type: custom:radio-card
title: Radio
browser: true                  # "Questo dispositivo": suona nel browser
alexa_type: TUNEIN
devices:
  - name: Echo cucina
    entity: media_player.echo_cucina
    icon: mdi:speaker
    mode: alexa                # Alexa Media Player: cerca la radio per nome
---
# Musica (libreria Jellyfin, elenco da scripts/music_sync.py)
type: custom:music-card
title: Musica
browser: true
devices:
  - name: TV
    script: script.jellyfin_tv
    icon: mdi:television
---
# Giochi (RomM, elenco da scripts/romm_sync.py)
type: custom:romm-games-card
title: Giochi
romm_url: http://192.168.1.10:8093
romm_url_remote: ""            # opzionale: indirizzo usato fuori casa (es. Tailscale)
refresh_minutes: 5
---
# Ricerca torrent con i plugin di qBittorrent e scelta della cartella di destinazione
type: custom:qbit-search-card
title: Cerca e scarica
max_results: 40
timeout_seconds: 40
film_path: /downloads/film          # percorsi visti dal container qBittorrent
series_path: /downloads/serietv     # (una sottocartella per serie)
music_path: /downloads/musica
games_path: /downloads/giochi
---
# Mappa della rete (network-map-card): luce verde/rossa, IP, batteria; orbita a cascata su PC/tablet, pannelli sul telefono.
# I dispositivi arrivano da soli dal registro di HA: qui si dice solo in quale ramo metterli e qualche correzione.
type: custom:network-map-card
title: Rete di casa
root: { name: Router, ip: 192.168.1.1 }          # entity: binary_sensor.<ping del router> per lo stato vero
branches:                                         # un ramo per gruppo di integrazioni (nome come in Impostazioni › Integrazioni)
  - { id: server, name: Server di casa, icon: mdi:server, ip: 192.168.1.10, integrations: [nut, zwave_js, ibeacon] }
  - { id: media, name: TV e intrattenimento, icon: mdi:television-play, integrations: [webostv, dlna_dmr, playstation_network, alexa_media] }
  - { id: smart, name: Casa smart Wi‑Fi, icon: mdi:home-automation, integrations: [tuya, shelly, reolink, ping] }
  - { id: telefoni, name: Telefoni, icon: mdi:cellphone, integrations: [mobile_app] }
devices:                                          # per nome del dispositivo
  Zigbee2MQTT Bridge: { name: Zigbee2MQTT, parent: "USB Z-Wave & Zigbee Controller" }
  Smoke Alarm: { parent: Gateway zigbee }
  Lavatrice: { status: availability }             # il suo sensore "connectivity" è il controllo remoto, non la rete
exclude_devices: [ Ovunque, This Device ]
---
# La pagina "Rete" nella barra di Aurora (aurora-plus-card v1.1+): stesso formato di "media"
type: custom:aurora-plus-card
aurora: { type: custom:aurora-v3-card }           # ...la vostra config di Aurora
views:
  - id: rete
    label: Rete
    icon: mdi:lan
    pages:
      - name: Rete
        cards:
          - type: custom:network-map-card         # ...la config qui sopra
